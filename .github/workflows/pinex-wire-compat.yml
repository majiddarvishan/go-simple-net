name: Pinex Wire Compatibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinex-cpp-golden:
    name: Verify Go wire codec against pinned Pinex C++ 1.5.0
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout neta-go
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout pinned Pinex C++ source
        uses: actions/checkout@v4
        with:
          repository: majiddarvishan/pinex
          ref: f7bd1eb779baff0d10e624f20522df345e6ee747
          path: .compat/pinex
          persist-credentials: false

      - name: Build the C++ production-serializer fixture generator
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra \
            -I .compat/pinex/include \
            testdata/pinex-1.5.0/golden.cpp \
            -o /tmp/pinex-wire-golden

      - name: Verify checked-in fixtures are generated by pinned C++ source
        run: |
          /tmp/pinex-wire-golden > /tmp/pinex-wire-golden.txt
          diff -u testdata/pinex-1.5.0/golden.txt /tmp/pinex-wire-golden.txt

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Test Go codec against C++ golden fixtures
        run: go test ./internal/wire
