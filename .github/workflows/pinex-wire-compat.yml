name: Pinex Wire Compatibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinex-cpp-golden:
    name: Verify Go wire codec against pinned Pinex C++ 1.5.0
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout neta-go
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build C++ fixture generator against pinned production headers
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra \
            -I testdata/pinex-1.5.0/source/include \
            testdata/pinex-1.5.0/golden.cpp \
            -o /tmp/pinex-wire-golden

      - name: Verify fixtures against the pinned C++ production serializer
        run: |
          /tmp/pinex-wire-golden > /tmp/pinex-wire-golden.txt
          diff -u testdata/pinex-1.5.0/golden.txt /tmp/pinex-wire-golden.txt

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Test Go codec against C++ golden fixtures
        run: go test ./internal/wire
