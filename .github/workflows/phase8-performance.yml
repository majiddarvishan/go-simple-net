name: Phase 8 Performance Baseline

on:
  push:
    branches: [main]
    paths:
      - 'phase8_benchmark_test.go'
      - 'phase8_pinex_benchmark_test.go'
      - 'Makefile'
      - 'scripts/phase8-benchmark.sh'
      - '.github/workflows/phase8-performance.yml'
      - 'go.mod'
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

concurrency:
  group: phase8-performance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    name: Reproducible Phase 8 performance suite
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Run complete Phase 8 suite
        env:
          ARTIFACT_DIR: artifacts/phase8
          NETA_PHASE8_SOAK_SECONDS: '300'
        run: make phase8

      - name: Upload benchmark and profile artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neta-go-phase8-${{ github.sha }}
          path: artifacts/phase8/
          if-no-files-found: warn
          retention-days: 30
