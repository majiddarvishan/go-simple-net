name: Performance Benchmarks

on:
  push:
    branches: [main]
    paths:
      - 'benchmark_test.go'
      - 'interoperability_benchmark_test.go'
      - 'Makefile'
      - 'scripts/performance.sh'
      - '.github/workflows/performance.yml'
      - 'go.mod'
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    name: Reproducible performance suite
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Run complete performance suite
        env:
          ARTIFACT_DIR: artifacts/performance
          NETA_SOAK_SECONDS: '300'
        run: make benchmark

      - name: Upload benchmark and profile artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neta-go-performance-${{ github.sha }}
          path: artifacts/performance/
          if-no-files-found: warn
          retention-days: 30
