name: Go

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Run shared correctness checks
        env:
          ARTIFACT_DIR: artifacts/ci
        run: make verify

      - name: Upload correctness logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neta-go-correctness-${{ github.sha }}
          path: artifacts/ci/
          if-no-files-found: warn
          retention-days: 14
